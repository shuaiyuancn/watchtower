name: Build & Release Windows 11 Client

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Native Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Build Release Binary
        run: |
          cd client
          cargo build --release

      - name: Prepare Binary Artifacts
        shell: pwsh
        run: |
          Copy-Item -Path "client\target\release\watchtower-client.exe" -Destination "watchtower.exe"
          $hash = (Get-FileHash -Path "watchtower.exe" -Algorithm SHA256).Hash
          Set-Content -Path "watchtower.exe.sha256" -Value $hash
          Write-Host "Generated watchtower.exe (SHA256: $hash)"

      - name: Publish GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Client Build' }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            watchtower.exe
            watchtower.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
