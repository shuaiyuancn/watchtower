name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend deps (workspace)
        run: npm ci

      - name: Install dashboard deps
        run: npm ci --prefix backend/web

      - name: Build backend + dashboard
        run: npm run build:backend

      - name: Run backend tests
        run: npm run test:backend

  client:
    name: client
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Build client (debug, compile check)
        working-directory: ./client
        run: cargo build

      - name: Run client unit tests
        working-directory: ./client
        run: cargo test

  client-macos:
    name: client-macos
    # macos-latest is an Apple Silicon image; the step below fails if it is not arm64.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check runner architecture
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Build client (debug, compile check)
        working-directory: ./client
        run: cargo build

      - name: Run client unit tests
        working-directory: ./client
        run: cargo test

      - name: Build client (release)
        working-directory: ./client
        run: cargo build --release

      - name: Show release binary signature
        working-directory: ./client
        run: |
          file target/release/watchtower-client
          codesign -dv target/release/watchtower-client

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-macos-arm64
          path: client/target/release/watchtower-client
          if-no-files-found: error
